<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | Messages</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div style="max-width: 600px; margin: 50px auto; padding: 20px; font-family: sans-serif;">
    
    <!-- Login Box -->
    <div id="loginBox">
      <h2>Admin Login</h2>
      <input type="password" id="adminPass" placeholder="Enter Admin Password" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc;">
      <button onclick="checkPassword()" class="btn" style="padding: 10px 20px; cursor: pointer;">Login</button>
      <p id="loginError" style="color: red; margin-top: 10px;"></p>
    </div>

    <!-- Messages Panel -->
    <div id="messagesPanel" style="display: none;">
      <h2>Client Messages</h2>
      <button onclick="logout()" style="margin-bottom: 20px; padding: 5px 10px; cursor: pointer;">Logout</button>
      <div id="messagesList">Loading messages...</div>
    </div>

  </div>

  <script>
    function checkPassword() {
      const inputPass = document.getElementById('adminPass').value;
      const errorMsg = document.getElementById('loginError');

      // Aapka password Mayo2468 set hai
      if (inputPass === 'Mayo24689') {
        errorMsg.textContent = "";
        showMessages();
      } else {
        errorMsg.textContent = "Incorrect password. Please try again.";
      }
    }

    async function showMessages() {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('messagesPanel').style.display = 'block';

      try {
        const res = await fetch('https://macwebelegance.vercel.app/api/messages');
        const messages = await res.json();
        const list = document.getElementById('messagesList');
        list.innerHTML = '';

        if (!messages || messages.length === 0) {
          list.innerHTML = '<p>No messages yet.</p>';
          return;
        }

        messages.forEach(msg => {
          const card = document.createElement('div');
          card.style.cssText = 'border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 8px; background: #f9f9f9; color: #333;';
          card.innerHTML = `
            <h3 style="margin: 0 0 5px 0;">${msg.name}</h3>
            <p style="margin: 0 0 5px 0;"><strong>Email:</strong> ${msg.email}</p>
            <p style="margin: 0 0 5px 0;"><strong>Message:</strong> ${msg.message}</p>
            <small style="color: #666;">${new Date(msg.date || Date.now()).toLocaleString()}</small>
          `;
          list.appendChild(card);
        });
      } catch (err) {
        document.getElementById('messagesList').innerHTML = '<p style="color: red;">Could not load messages from server.</p>';
      }
    }

    function logout() {
      document.getElementById('loginBox').style.display = 'block';
      document.getElementById('messagesPanel').style.display = 'none';
      document.getElementById('adminPass').value = '';
    }
  </script>
</body>
</html>
